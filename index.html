<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Galeria Modo Escuro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme"> <!-- Classe inicial -->
    
    <header>
        <h1>Minha Galeria</h1>
        <button id="theme-toggle">Alternar Tema</button>
    </header>

    <main class="gallery">
        <img src="perro.jfif" alt="Imagem 1">
        <img src="perro2.jpg" alt="Imagem 2">
        <img src="perro3.jfif" alt="Imagem 3">
        <img src="perro4.avif" alt="Imagem 4">
    </main>

    <script src="script.js"></script>
</body>
</html>
